<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandon Moon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/3ade8a26c6.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <section id="landing-page">
      <nav aria-label="Main navigation">
        <figure class="personal__logo">
          <img
            id="personal__logo--img"
            src="./assets/Codex Image Aug 17, 2026, 09_01_17 PM.png"
            alt="Brandon Moon logo"
          >
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">About</a>
          </li>
          <li class="nav__link">
            <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Projects</a>
          </li>
          <li class="nav__link">
            <a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Contact</a>
          </li>
          <li class="nav__link click">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              aria-label="Toggle color theme"
            >
              <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </nav>
      <header class="header">
        <div class="header__content">
          <h1 class="title">Hey</h1>
          <h1 class="title purple">I'm Brandon</h1>
          <p class="header__para">
            I'm a <b class="purple">Frontend Software Engineer</b> with a strong
            passion for building web applications with great user
            experiences.
            <br>
            Here's a bit more <b class="purple">about me.</b>
          </p>
          <div class="social__list">
            <a
              href="https://www.linkedin.com/in/brandon-moon-020a41439"
              class="social__link click"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
            </a>
            <a
              href="https://github.com/brandonmoon237-droid"
              class="social__link click"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <i class="fa-brands fa-github" aria-hidden="true"></i>
            </a>
            <a
              href="./assets/Brandon_Moon_Frontend_Resume.pdf"
              class="social__link click"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="View my resume"
            >
              <i class="fa-regular fa-file-pdf" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </header>

      <button type="button" class="mail__btn click" aria-label="Contact me">
        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
      </button>
      <a href="#projects" class="scroll" aria-label="Scroll to projects">
        <div class="scroll__icon click" aria-hidden="true"></div>
      </a>

    </section>
  </body>
</html>
